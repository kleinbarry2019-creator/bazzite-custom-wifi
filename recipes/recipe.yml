# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-custom-wifi
description: Bazzite Custom Image mit integriertem RTL8812AU WLAN-Treiber.

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: akmods
    install:
      - 8812au

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        - firefox
