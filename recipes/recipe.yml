# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: bazzite-custom-wifi
description: Custom Bazzite image with WLAN support for FRITZ!WLAN AC 860
base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - dkms
        - git
        - kernel-devel
        - kernel-headers
        - gcc
        - make

  - type: script
    scripts:
      - |
        git clone https://github.com/morrownr/8812au-20210629.git /tmp/8812au
        cd /tmp/8812au
        # Installiert den Treiber direkt ohne interaktiven DKMS-Fehler
        ./install-driver.sh noבים
        rm -rf /tmp/8812au
